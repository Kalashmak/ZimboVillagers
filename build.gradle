// tools/astra.py probes: `runClient -PastraLaunchOnly` writes the exact client launch (JVM arguments, main class, arguments, classpath,
// environment) as ForgeGradle prepares it, then the JVM only prints its version: several clients start straight from one build, each in its
// own game directory with its own -Dvillageastra.* flags. The provider is added only with that flag, so ordinary runs are unchanged.
if(project.hasProperty('astraLaunchOnly')) tasks.withType(JavaExec).matching { it.name == 'runClient' }.configureEach { JavaExec run ->
    def inside = new ThreadLocal<Boolean>()
    run.jvmArgumentProviders.add({
        if(inside.get()) return []
        inside.set(true)
        try {
            def env = run.environment.findAll { k, v -> System.getenv(k.toString()) != v?.toString() }.collectEntries { k, v -> [(k.toString()): v.toString()] }
            def data = [javaHome: run.javaLauncher.present ? run.javaLauncher.get().metadata.installationPath.asFile.absolutePath : null,
                        mainClass: run.mainClass.get(), jvmArgs: run.allJvmArgs, args: run.args, classpath: run.classpath.files*.absolutePath,
                        environment: env, workingDir: run.workingDir.absolutePath]
            def out = layout.buildDirectory.file('astra-launch/client.json').get().asFile
            out.parentFile.mkdirs()
            out.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(data))
            println "ASTRA_LAUNCH written ${out} (${data.classpath.size()} classpath entries)"
        } finally { inside.set(false) }
        return ['-version']
    } as CommandLineArgumentProvider)
}

